<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark AI</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@b402/web-provider@latest/dist/b402.js"></script>

    <style>
        /* CSS untuk Tampilan */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 90vh;
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        #connectWalletBtn {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #connectWalletBtn:hover {
            background-color: #a060fc;
        }

        #connectWalletBtn:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 0.8rem 1.2rem;
            border-radius: 18px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--primary-color);
            color: #121212;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background-color: #333;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        #chat-form {
            display: flex;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            gap: 1rem;
        }

        #chat-input {
            flex-grow: 1;
            background-color: #333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
        }

        #chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        #chat-input:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        #chat-form button {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #chat-form button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #rateLimitMessage {
            text-align: center;
            padding: 1rem;
            background-color: #442222;
            color: #ff9999;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        /* (BARU) CSS untuk Tombol Mint */
        .mint-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 0.25rem 0;
            display: block;
            width: 100%;
            box-sizing: border-box; 
            transition: background-color 0.2s;
        }

        .mint-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <h1>Spark AI</h1>
            <button id="connectWalletBtn">Connect Wallet</button>
        </header>

        <div id="rateLimitMessage" class="hidden">
            You have reached the 5-message trial limit. Please connect your wallet to continue.
        </div>

        <div id="chat-box">
            <div class="message bot-message">
                Welcome to Spark AI! You have 5 trial messages. Connect your wallet for unlimited chat. Type /mint to see minting options.
            </div>
        </div>

        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        // JavaScript Logic
        document.addEventListener('DOMContentLoaded', () => {
            // Element Selectors
            const chatBox = document.getElementById('chat-box');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const connectWalletBtn = document.getElementById('connectWalletBtn');
            const rateLimitMessage = document.getElementById('rateLimitMessage');
            const sendButton = chatForm.querySelector('button');

            // Status Variables
            let userAddress = null;
            let messageCount = parseInt(localStorage.getItem('sparkAIMessageCount') || '0');

            // --- 1. Initialization & Login Status Check ---
            function initialize() {
                const storedAddress = localStorage.getItem('sparkAIUserAddress');
                if (storedAddress) {
                    userAddress = storedAddress;
                    updateUIForLoggedIn();
                } else {
                    checkRateLimit();
                }
            }

            function updateUIForLoggedIn() {
                connectWalletBtn.textContent = `Connected: ${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;
                connectWalletBtn.disabled = true;
                rateLimitMessage.classList.add('hidden');
                chatInput.disabled = false;
                sendButton.disabled = false;
                chatInput.placeholder = "You are connected. Ask anything or type /mint";
            }

            function checkRateLimit() {
                if (messageCount >= 5) {
                    showRateLimit();
                } else {
                    addMessage(`You have ${5 - messageCount} trial messages remaining.`, 'bot');
                }
            }

            function showRateLimit() {
                rateLimitMessage.classList.remove('hidden');
                chatInput.disabled = true;
                sendButton.disabled = true;
                chatInput.placeholder = "Trial limit reached. Connect wallet.";
            }

            // --- 2. Wallet Connection Function ---
            async function connectWallet() {
                if (typeof window.ethereum !== 'undefined') {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        userAddress = accounts[0];
                        localStorage.setItem('sparkAIUserAddress', userAddress);
                        updateUIForLoggedIn();
                        addMessage('Wallet connected successfully!', 'bot');
                    } catch (error) {
                        console.error('Wallet connection failed:', error);
                        addMessage('Failed to connect wallet. Please try again.', 'bot');
                    }
                } else {
                    alert('MetaMask not detected! Please install MetaMask to use this feature.');
                }
            }

            // --- 3. Chat Submission Function (Handles /mint) ---
            async function handleChatSubmit(event) {
                event.preventDefault();
                const userMessage = chatInput.value.trim();
                if (!userMessage) return;

                addMessage(userMessage, 'user');
                chatInput.value = '';

                // --- /mint Command Logic ---
                if (userMessage.toLowerCase() === '/mint') {
                    if (!userAddress) {
                        addMessage("Please connect your wallet first to use the /mint command.", 'bot');
                        return;
                    }
                    // Show buttons, do not call Gemini
                    showMintButtons(); 
                    return;
                }

                // --- Trial Rate Limit Logic ---
                if (!userAddress) {
                    messageCount++;
                    localStorage.setItem('sparkAIMessageCount', messageCount);
                    if (messageCount > 5) {
                        showRateLimit();
                        addMessage('You have exceeded the 5 free messages. Please connect your wallet.', 'bot');
                        return;
                    }
                }
                
                // --- Call Gemini Chat API ---
                const typingIndicator = addMessage('Spark AI is thinking...', 'bot');
                try {
                    const botResponse = await callGeminiAPI(userMessage);
                    chatBox.removeChild(typingIndicator);
                    addMessage(botResponse, 'bot');
                } catch (error) {
                    chatBox.removeChild(typingIndicator);
                    addMessage(`Error: ${error.message}`, 'bot');
                }
            }

            // --- 4. Function to Add Message to UI (Handles HTML) ---
            function addMessage(text, sender, isHtml = false) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message', `${sender}-message`);
                
                if (isHtml) {
                    messageElement.innerHTML = text; // Renders HTML (for buttons)
                } else {
                    messageElement.textContent = text; // Renders plain text
                }
                
                chatBox.appendChild(messageElement);
                chatBox.scrollTop = chatBox.scrollHeight;
                return messageElement;
            }
            
            // --- 5. Function to Show Mint Buttons ---
            function showMintButtons() {
                const buttonHtml = `
                    <p>Please select a minting option:</p>
                    <button class="mint-button" data-amount="1" data-tokens="5000">Mint 1$ for 5,000 tokens</button>
                    <button class="mint-button" data-amount="10" data-tokens="50000">Mint 10$ for 50,000 tokens</button>
                `;
                addMessage(buttonHtml, 'bot', true);
            }
            
            // --- 6. B402 Mint Button Click Handler (LOGIKA UTAMA) ---
            chatBox.addEventListener('click', async (event) => {
                if (event.target.classList.contains('mint-button')) {
                    
                    event.target.disabled = true;
                    event.target.textContent = "Please check MetaMask...";

                    const amount = event.target.dataset.amount;
                    const tokens = event.target.dataset.tokens;

                    // Check if B402 library is loaded
                    if (typeof B402 === 'undefined') {
                        addMessage('Error: B402 library not loaded. Please refresh.', 'bot');
                        event.target.disabled = false;
                        return;
                    }
                    
                    // =================================================================
                    // !!! PENTING !!!
                    // GANTI '0xAlamatWalletPenerimaAnda' DENGAN SELLER_ADDRESS ANDA
                    // Ini harus SAMA PERSIS dengan yang ada di file .env di VPS Anda
                    // =================================================================
                    const SELLER_ADDRESS = '0xAlamatWalletPenerimaAnda'; 
                    // =================================================================

                    if (SELLER_ADDRESS === '0xAlamatWalletPenerimaAnda') {
                        addMessage('Error: Frontend is not configured. Please contact the site administrator.', 'bot');
                        event.target.disabled = false;
                        event.target.textContent = `Mint ${amount}$ for ${tokens} tokens`;
                        return;
                    }

                    const b402 = new B402();
                    const requirements = {
                        scheme: 'exact',
                        network: 'bsc',
                        asset: '0x8d0d000ee44948fc98c9b98a4fa4921476f08b0d', // USD1_TOKEN
                        payTo: SELLER_ADDRESS,
                        amountRequired: ethers.parseUnits(amount, 18), // Konversi '$1' -> 1000...
                        maxTimeoutSeconds: 600,
                        relayerContract: '0xE1C2830d5DDd6B49E9c46EbE03a98Cb44CD8eA5a'
                    };
                    
                    try {
                        // 1. Minta Otorisasi dari MetaMask
                        const { authorization, signature } = await b402.authorize(requirements);
                        
                        event.target.textContent = "Authorizing... Settling...";

                        // 2. Kirim Otorisasi ke Backend untuk Diselesaikan
                        const response = await fetch('https://api.spark-ai.xyz/accept-payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                authorization: authorization,
                                signature: signature
                            })
                        });

                        const data = await response.json();

                        if (!response.ok || !data.success) {
                            throw new Error(data.error || 'Minting process failed on server.');
                        }

                        // 3. Sukses!
                        addMessage(`Success! Payment of ${data.amount} USD1 received. Tx: ${data.transaction}`, 'bot');
                        event.target.textContent = "Minted!";
                        event.target.style.backgroundColor = "#28a745"; // Jadi hijau

                    } catch (error) {
                        console.error('B402 Minting failed:', error);
                        addMessage(`Minting failed: ${error.message}`, 'bot');
                        // Aktifkan kembali tombol jika gagal
                        event.target.disabled = false;
                        event.target.textContent = `Mint ${amount}$ for ${tokens} tokens`;
                    }
                }
            });

            // --- 7. Gemini Chat API Call ---
            async function callGeminiAPI(message) { 
                const backendUrl = 'https://api.spark-ai.xyz/chat'; 
                console.log(`Sending message to backend: ${message}`);
                try {
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: message })
                    });
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.statusText}`);
                    }
                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    return data.text;
                } catch (error) {
                    console.error('Failed to retrieve data from backend:', error);
                    return `Sorry, an error occurred while connecting to the server: ${error.message}`;
                }
            }

            // --- 8. Event Listeners (Bottom) ---
            connectWalletBtn.addEventListener('click', connectWallet);
            chatForm.addEventListener('submit', handleChatSubmit);

            // --- 9. Run Initialization ---
            initialize();
        });
    </script>
</body>
</html>
