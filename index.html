<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark AI</title>
    <style>
        /* CSS (Tidak ada perubahan) */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 90vh;
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        #connectWalletBtn {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #connectWalletBtn:hover {
            background-color: #a060fc;
        }

        #connectWalletBtn:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 0.8rem 1.2rem;
            border-radius: 18px;
            max-width: 75%;
            line-height: 1.5;
        }

        .user-message {
            background-color: var(--primary-color);
            color: #121212;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background-color: #333;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        #chat-form {
            display: flex;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            gap: 1rem;
        }

        #chat-input {
            flex-grow: 1;
            background-color: #333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
        }

        #chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        #chat-input:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        #chat-form button {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #chat-form button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #rateLimitMessage {
            text-align: center;
            padding: 1rem;
            background-color: #442222;
            color: #ff9999;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <h1>Spark AI</h1>
            <button id="connectWalletBtn">Connect Wallet</button>
        </header>

        <div id="rateLimitMessage" class="hidden">
            You have reached the 5-message trial limit. Please connect your wallet to continue.
        </div>

        <div id="chat-box">
            <div class="message bot-message">
                Welcome to Spark AI! You have 5 trial messages. Connect your wallet for unlimited chat.
            </div>
        </div>

        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        // JavaScript Logic
        document.addEventListener('DOMContentLoaded', () => {
            // Element Selectors
            const chatBox = document.getElementById('chat-box');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const connectWalletBtn = document.getElementById('connectWalletBtn');
            const rateLimitMessage = document.getElementById('rateLimitMessage');
            const sendButton = chatForm.querySelector('button');

            // Status Variables
            let userAddress = null;
            // Get data from 'browser cache' (localStorage)
            let messageCount = parseInt(localStorage.getItem('sparkAIMessageCount') || '0');

            // --- 1. Initialization & Login Status Check ---
            function initialize() {
                const storedAddress = localStorage.getItem('sparkAIUserAddress');
                if (storedAddress) {
                    userAddress = storedAddress;
                    updateUIForLoggedIn();
                } else {
                    // If not logged in, check if they hit the rate limit
                    checkRateLimit();
                }
            }

            function updateUIForLoggedIn() {
                // Display truncated wallet address
                connectWalletBtn.textContent = `Connected: ${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;
                connectWalletBtn.disabled = true;
                // Hide rate limit message and enable input
                rateLimitMessage.classList.add('hidden');
                chatInput.disabled = false;
                sendButton.disabled = false;
                // DIUBAH
                chatInput.placeholder = "You are connected. Ask anything...";
            }

            function checkRateLimit() {
                if (messageCount >= 5) {
                    showRateLimit();
                } else {
                    // DIUBAH
                    addMessage(`You have ${5 - messageCount} trial messages remaining.`, 'bot');
                }
            }

            function showRateLimit() {
                rateLimitMessage.classList.remove('hidden');
                chatInput.disabled = true;
                sendButton.disabled = true;
                // DIUBAH
                chatInput.placeholder = "Trial limit reached. Connect wallet.";
            }

            // --- 2. Wallet Connection Function ---
            async function connectWallet() {
                if (typeof window.ethereum !== 'undefined') {
                    try {
                        // Request user permission to connect
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        userAddress = accounts[0];
                        
                        // Save wallet address to localStorage
                        localStorage.setItem('sparkAIUserAddress', userAddress);
                        
                        // Update UI
                        updateUIForLoggedIn();
                        // DIUBAH
                        addMessage('Wallet connected successfully!', 'bot');

                    } catch (error) {
                        // DIUBAH
                        console.error('Wallet connection failed:', error);
                        // DIUBAH
                        addMessage('Failed to connect wallet. Please try again.', 'bot');
                    }
                } else {
                    // DIUBAH
                    alert('MetaMask not detected! Please install MetaMask to use this feature.');
                }
            }

            // --- 3. Chat Submission Function ---
            async function handleChatSubmit(event) {
                event.preventDefault();
                const userMessage = chatInput.value.trim();

                if (!userMessage) return;

                addMessage(userMessage, 'user');
                chatInput.value = '';

                // --- Trial Rate Limit Logic ---
                if (!userAddress) { // If user is NOT logged in
                    messageCount++;
                    // Save count to localStorage
                    localStorage.setItem('sparkAIMessageCount', messageCount);

                    if (messageCount > 5) {
                        showRateLimit();
                        // DIUBAH
                        addMessage('You have exceeded the 5 free messages. Please connect your wallet.', 'bot');
                        return; // Stop processing
                    }
                }
                
                // If user is logged in OR still in trial, call API
                // Show "thinking" indicator
                // DIUBAH
                const typingIndicator = addMessage('Spark AI is thinking...', 'bot');
                
                try {
                    const botResponse = await callMockGeminiAPI(userMessage);
                    // Remove "thinking" indicator
                    chatBox.removeChild(typingIndicator);
                    // Show bot response
                    addMessage(botResponse, 'bot');
                } catch (error) {
                    chatBox.removeChild(typingIndicator);
                    addMessage(`Error: ${error.message}`, 'bot');
                }
            }

            // --- 4. Function to Add Message to UI ---
            function addMessage(text, sender) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message', `${sender}-message`);
                messageElement.textContent = text;
                chatBox.appendChild(messageElement);
                // Auto-scroll to the latest message
                chatBox.scrollTop = chatBox.scrollHeight;
                return messageElement;
            }

            // --- 5. API CALL ---
            async function callMockGeminiAPI(message) {
                const backendUrl = 'https://api.spark-ai.xyz/chat'; 
                
                // DIUBAH
                console.log(`Sending message to backend: ${message}`);

                try {
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ prompt: message }) // Send message in JSON format
                    });

                    if (!response.ok) {
                        // If the server returns an error (e.g., 500)
                        throw new Error(`Server error: ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    if (data.error) {
                         // If the server returns a specific error message
                        throw new Error(data.error);
                    }

                    return data.text; // Return text from the JSON response

                } catch (error) {
                    // DIUBAH
                    console.error('Failed to retrieve data from backend:', error);
                    // DIUBAH
                    return `Sorry, an error occurred while connecting to the server: ${error.message}`;
                }
            }

            // --- Event Listeners ---
            connectWalletBtn.addEventListener('click', connectWallet);
            chatForm.addEventListener('submit', handleChatSubmit);

            // Run initialization when the page loads
            initialize();
        });
    </script>
</body>
</html>
