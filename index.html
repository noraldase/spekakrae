<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark AI</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@b402/sdk@latest/dist/b402.js"></script>

    <style>
        /* ... (Semua CSS Anda dari sebelumnya tetap sama) ... */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 90vh;
            background-color: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        /* (BARU) Styling untuk kontainer tombol wallet */
        #wallet-controls {
            display: flex;
            gap: 0.5rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        /* (BARU) Styling untuk kedua tombol */
        #connectWalletBtn, #disconnectWalletBtn {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #connectWalletBtn:hover {
            background-color: #a060fc;
        }

        /* (BARU) Styling tombol disconnect agar berbeda */
        #disconnectWalletBtn {
            background-color: #555;
            color: #e0e0e0;
        }
        #disconnectWalletBtn:hover {
            background-color: #dc3545; /* Merah saat hover */
        }
        
        #connectWalletBtn:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
        }
        
        /* ... (Sisa CSS Anda tetap sama) ... */
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            padding: 0.8rem 1.2rem;
            border-radius: 18px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--primary-color);
            color: #121212;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background-color: #333;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #chat-form {
            display: flex;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            gap: 1rem;
        }
        #chat-input {
            flex-grow: 1;
            background-color: #333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
        }
        #chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        #chat-input:disabled {
            background-color: #444;
            cursor: not-allowed;
        }
        #chat-form button {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #chat-form button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #rateLimitMessage {
            text-align: center;
            padding: 1rem;
            background-color: #442222;
            color: #ff9999;
            font-size: 0.9rem;
        }
        .hidden {
            display: none;
        }
        .mint-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 0.25rem 0;
            display: block;
            width: 100%;
            box-sizing: border-box; 
            transition: background-color 0.2s;
        }
        .mint-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <h1>Spark AI</h1>
            <div id="wallet-controls">
                <button id="connectWalletBtn">Connect Wallet</button>
                <button id="disconnectWalletBtn" class="hidden">Disconnect</button>
            </div>
        </header>

        <div id="rateLimitMessage" class="hidden">
            You have reached the 5-message trial limit. Please connect your wallet to continue.
        </div>

        <div id="chat-box">
            <div class="message bot-message">
                Welcome to Spark AI! You have 5 trial messages. Connect your wallet for unlimited chat. Type /mint to see minting options.
            </div>
        </div>

        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // (DIUBAH) Selektor Elemen
            const chatBox = document.getElementById('chat-box');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const connectWalletBtn = document.getElementById('connectWalletBtn');
            const disconnectWalletBtn = document.getElementById('disconnectWalletBtn'); // (BARU)
            const rateLimitMessage = document.getElementById('rateLimitMessage');
            const sendButton = chatForm.querySelector('button');

            // Variabel Status
            let userAddress = null;
            let messageCount = parseInt(localStorage.getItem('sparkAIMessageCount') || '0');

            // --- 1. Inisialisasi & Cek Status Login ---
            function initialize() {
                // (BARU) Sembunyikan tombol disconnect saat awal
                disconnectWalletBtn.classList.add('hidden');
                connectWalletBtn.classList.remove('hidden');
                
                const storedAddress = localStorage.getItem('sparkAIUserAddress');
                if (storedAddress) {
                    userAddress = storedAddress;
                    updateUIForLoggedIn();
                } else {
                    checkRateLimit();
                }
            }

            // (DIUBAH) updateUIForLoggedIn
            function updateUIForLoggedIn() {
                // (BARU) Logika untuk menyembunyikan/menampilkan tombol
                connectWalletBtn.classList.add('hidden');
                disconnectWalletBtn.classList.remove('hidden');
                
                // (DIUBAH) Tampilkan alamat di tombol disconnect
                disconnectWalletBtn.textContent = `Disconnect: ${userAddress.substring(0, 6)}...`;
                
                rateLimitMessage.classList.add('hidden');
                chatInput.disabled = false;
                sendButton.disabled = false;
                chatInput.placeholder = "You are connected. Ask anything or type /mint";
            }

            function checkRateLimit() {
                if (messageCount >= 5) {
                    showRateLimit();
                } else {
                    addMessage(`You have ${5 - messageCount} trial messages remaining.`, 'bot');
                }
            }

            function showRateLimit() {
                rateLimitMessage.classList.remove('hidden');
                chatInput.disabled = true;
                sendButton.disabled = true;
                chatInput.placeholder = "Trial limit reached. Connect wallet.";
            }

            // --- 2. Fungsi Koneksi Wallet ---
            async function connectWallet() {
                if (typeof window.ethereum !== 'undefined') {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                        userAddress = accounts[0];
                        localStorage.setItem('sparkAIUserAddress', userAddress);
                        updateUIForLoggedIn();
                        addMessage('Wallet connected successfully!', 'bot');
                    } catch (error) {
                        console.error('Wallet connection failed:', error);
                        addMessage('Failed to connect wallet. Please try again.', 'bot');
                    }
                } else {
                    alert('MetaMask not detected! Please install MetaMask to use this feature.');
                }
            }
            
            // --- (BARU) Fungsi Disconnect Wallet ---
            function disconnectWallet() {
                localStorage.removeItem('sparkAIUserAddress');
                localStorage.removeItem('sparkAIMessageCount'); // Hapus juga hitungan trial
                location.reload(); // Reload halaman untuk mereset
            }

            // --- 3. Fungsi Pengiriman Chat (Tetap Sama) ---
            async function handleChatSubmit(event) {
                event.preventDefault();
                const userMessage = chatInput.value.trim();
                if (!userMessage) return;

                addMessage(userMessage, 'user');
                chatInput.value = '';

                if (userMessage.toLowerCase() === '/mint') {
                    if (!userAddress) {
                        addMessage("Please connect your wallet first to use the /mint command.", 'bot');
                        return;
                    }
                    showMintButtons(); 
                    return;
                }

                if (!userAddress) {
                    messageCount++;
                    localStorage.setItem('sparkAIMessageCount', messageCount);
                    if (messageCount > 5) {
                        showRateLimit();
                        addMessage('You have exceeded the 5 free messages. Please connect your wallet.', 'bot');
                        return;
                    }
                }
                
                const typingIndicator = addMessage('Spark AI is thinking...', 'bot');
                try {
                    const botResponse = await callGeminiAPI(userMessage);
                    chatBox.removeChild(typingIndicator);
                    addMessage(botResponse, 'bot');
                } catch (error) {
                    chatBox.removeChild(typingIndicator);
                    addMessage(`Error: ${error.message}`, 'bot');
                }
            }

            // --- 4. Fungsi Menambahkan Pesan (Tetap Sama) ---
            function addMessage(text, sender, isHtml = false) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message', `${sender}-message`);
                if (isHtml) {
                    messageElement.innerHTML = text;
                } else {
                    messageElement.textContent = text;
                }
                chatBox.appendChild(messageElement);
                chatBox.scrollTop = chatBox.scrollHeight;
                return messageElement;
            }
            
            // --- 5. Fungsi Tombol Mint (Tetap Sama) ---
            function showMintButtons() {
                const buttonHtml = `
                    <p>Please select a minting option:</p>
                    <button class="mint-button" data-amount="1" data-tokens="5000">Mint 1$ for 5,000 tokens</button>
                    <button class="mint-button" data-amount="10" data-tokens="50000">Mint 10$ for 50,000 tokens</button>
                `;
                addMessage(buttonHtml, 'bot', true);
            }
            
            // --- 6. B402 Mint Button Click Handler (Tetap Sama) ---
            chatBox.addEventListener('click', async (event) => {
                if (event.target.classList.contains('mint-button')) {
                    
                    event.target.disabled = true;
                    event.target.textContent = "Please check MetaMask...";

                    const amount = event.target.dataset.amount;
                    const tokens = event.target.dataset.tokens;

                    if (typeof B402 === 'undefined') {
                        addMessage('Error: Error. Please refresh.', 'bot');
                        event.target.disabled = false;
                        return;
                    }
                    
                    // =================================================================
                    // GANTI '0xAlamatWalletPenerimaAnda' DENGAN SELLER_ADDRESS ANDA
                    // =================================================================
                    const SELLER_ADDRESS = '0xbdDD85bc42010110B8184d0fDA25659688bf935E'; // GANTI INI
                    // =================================================================

                    if (SELLER_ADDRESS === '0xAlamatWalletPenerimaAnda') {
                        addMessage('Error: Frontend is not configured. Please contact the site administrator.', 'bot');
                        event.target.disabled = false;
                        event.target.textContent = `Mint ${amount}$ for ${tokens} tokens`;
                        return;
                    }

                    const b402 = new B402();
                    
                    // --- (DIUBAH) Logika untuk Testnet ---
                    // Ganti ini ke 'bsc' dan alamat mainnet jika sudah live
                    const requirements = {
                        scheme: 'exact',
                        network: 'bsc-testnet', // Ganti ke 'bsc' untuk Mainnet
                        asset: '0x337610d27c682E347C9cD60BD4b3b107C9d34dDd', // USD1T (Testnet)
                        payTo: SELLER_ADDRESS,
                        amountRequired: ethers.parseUnits(amount, 18), 
                        maxTimeoutSeconds: 600,
                        relayerContract: '0xd67eF16fa445101Ef1e1c6A9FB9F3014f1d60DE6' // Relayer (Testnet)
                    };
                    
                    try {
                        // 1. Otorisasi
                        const { authorization, signature } = await b402.authorize(requirements);
                        
                        event.target.textContent = "Authorizing... Settling...";

                        // 2. Kirim ke Backend
                        const response = await fetch('https://api.spark-ai.xyz/accept-payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                authorization: authorization,
                                signature: signature,
                                tokensToMint: tokens // Kirim jumlah token ke backend
                            })
                        });

                        const data = await response.json();

                        if (!response.ok || !data.success) {
                            throw new Error(data.error || 'Minting process failed.');
                        }

                        // 3. Sukses
                        // (BARU) Menampilkan kedua hash transaksi
                        addMessage(`Success! Payment: ${data.paymentTransaction.substring(0, 10)}... Reward: ${data.rewardTransaction.substring(0, 10)}...`, 'bot');
                        event.target.textContent = "Minted!";
                        event.target.style.backgroundColor = "#28a745";

                    } catch (error) {
                        console.error('Minting failed:', error);
                        addMessage(`Minting failed: ${error.message}`, 'bot');
                        event.target.disabled = false;
                        event.target.textContent = `Mint ${amount}$ for ${tokens} tokens`;
                    }
                }
            });

            // --- 7. Gemini Chat API Call (Tetap Sama) ---
            async function callGeminiAPI(message) { 
                const backendUrl = 'https://api.spark-ai.xyz/chat'; 
                console.log(`Sending message to backend: ${message}`);
                try {
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: message })
                    });
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.statusText}`);
                    }
                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    return data.text;
                } catch (error) {
                    console.error('Failed to retrieve data from backend:', error);
                    return `Sorry, an error occurred while connecting to the server: ${error.message}`;
                }
            }

            // --- 8. Event Listeners (DIUBAH) ---
            connectWalletBtn.addEventListener('click', connectWallet);
            disconnectWalletBtn.addEventListener('click', disconnectWallet); // (BARU)
            chatForm.addEventListener('submit', handleChatSubmit);
            
            
            // --- (BARU) MetaMask Event Listeners ---
            if (typeof window.ethereum !== 'undefined') {
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        // Pengguna memutuskan koneksi dari dalam MetaMask
                        console.log('User disconnected from MetaMask.');
                        // Hanya panggil disconnect jika kita *sebelumnya* login
                        if (localStorage.getItem('sparkAIUserAddress')) {
                            disconnectWallet();
                        }
                    } else if (userAddress && accounts[0].toLowerCase() !== userAddress.toLowerCase()) {
                        // Pengguna mengganti akun
                        console.log('Account switched to:', accounts[0]);
                        // Simpan akun baru dan reload halaman
                        localStorage.setItem('sparkAIUserAddress', accounts[0]);
                        location.reload();
                    }
                });
            }

            // --- 9. Run Initialization ---
            initialize();
        });
    </script>
</body>
</html>
