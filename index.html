<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark AI</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@b402/sdk@latest/dist/b402.js"></script>

    <style>
        :root { /* Warna dasar */
            --bg-color: #121212; --surface-color: #1e1e1e;
            --primary-color: #bb86fc; --text-color: #e0e0e0;
            --border-color: #333; --button-color: #007bff;
        }
        body { 
            font-family: sans-serif; background-color: var(--bg-color); 
            color: var(--text-color); margin: 0; display: flex; 
            justify-content: center; align-items: center; height: 100vh;
        }
        .container {
            width: 90%; max-width: 600px; height: 85vh; 
            background-color: var(--surface-color); border-radius: 10px;
            border: 1px solid var(--border-color); display: flex; 
            flex-direction: column; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        header { 
            padding: 1rem; border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-size: 1.4rem; color: var(--primary-color); }
        #mintButton { /* Styling tombol mint */
            background-color: var(--button-color); color: white; border: none;
            padding: 0.6rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s;
        }
        #mintButton:hover { background-color: #0056b3; }
        #mintButton:disabled { background-color: #555; cursor: not-allowed; }

        #chat-box { /* Area chat */
            flex-grow: 1; overflow-y: auto; padding: 1rem; 
            display: flex; flex-direction: column; gap: 0.8rem;
        }
        .message { 
            padding: 0.7rem 1rem; border-radius: 15px; max-width: 80%; 
            line-height: 1.4; word-wrap: break-word; 
        }
        .user-message { 
            background-color: var(--primary-color); color: #121212; 
            align-self: flex-end; border-bottom-right-radius: 3px; 
        }
        .bot-message { 
            background-color: #333; color: var(--text-color); 
            align-self: flex-start; border-bottom-left-radius: 3px; 
        }
        #chat-form { /* Input form */
            display: flex; padding: 1rem; border-top: 1px solid var(--border-color); gap: 0.5rem;
        }
        #chat-input { 
            flex-grow: 1; background-color: #333; border: 1px solid #444; 
            border-radius: 6px; padding: 0.7rem; color: var(--text-color); font-size: 1rem; 
        }
        #chat-form button { 
            background-color: var(--primary-color); color: #121212; border: none; 
            padding: 0.7rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .status-message { /* Pesan status (error/sukses) */
            font-style: italic; color: #aaa; font-size: 0.9em; align-self: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Spark AI</h1>
            <button id="mintButton">Mint 5000 Tokens (1 USD1T)</button>
        </header>

        <div id="chat-box">
            <div class="message bot-message">Welcome! Ask me anything or click the Mint button.</div>
        </div>

        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Selektor
            const chatBox = document.getElementById('chat-box');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const mintButton = document.getElementById('mintButton');

            // --- Fungsi Tambah Pesan ---
            function addMessage(text, sender, isStatus = false) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message');
                if (isStatus) {
                    messageElement.classList.add('status-message');
                } else {
                    messageElement.classList.add(`${sender}-message`);
                }
                messageElement.textContent = text;
                chatBox.appendChild(messageElement);
                chatBox.scrollTop = chatBox.scrollHeight; // Auto scroll
                return messageElement;
            }

            // --- Logika Chat AI ---
            chatForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const userMessage = chatInput.value.trim();
                if (!userMessage) return;

                addMessage(userMessage, 'user');
                chatInput.value = '';
                const thinkingMsg = addMessage('Spark AI is thinking...', 'bot');

                try {
                    const response = await fetch('https://api.spark-ai.xyz/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: userMessage })
                    });
                    if (!response.ok) throw new Error(`Server error: ${response.statusText}`);
                    const data = await response.json();
                    chatBox.removeChild(thinkingMsg); // Hapus pesan "thinking"
                    addMessage(data.text, 'bot');
                } catch (error) {
                    console.error('Chat failed:', error);
                    chatBox.removeChild(thinkingMsg);
                    addMessage(`Error getting response: ${error.message}`, 'bot', true); // Tampilkan error sbg status
                }
            });

            // --- Logika Tombol Mint (B402) ---
            mintButton.addEventListener('click', async () => {
                mintButton.disabled = true; // Nonaktifkan tombol
                mintButton.textContent = "Check Wallet...";
                addMessage("Initiating mint process...", 'bot', true); // Pesan status

                // Periksa library & MetaMask
                if (typeof B402 === 'undefined') {
                    addMessage('Error: B402 library not loaded. Please refresh.', 'bot', true);
                    mintButton.disabled = false;
                    mintButton.textContent = "Mint 5000 Tokens (1 USD1T)";
                    return;
                }
                 if (typeof window.ethereum === 'undefined') {
                    alert('MetaMask not detected! Please install MetaMask.');
                     mintButton.disabled = false;
                     mintButton.textContent = "Mint 5000 Tokens (1 USD1T)";
                    return;
                }
                
                // =====================================================================
                // !!! PENTING: GANTI DENGAN ALAMAT PENERIMA ANDA (SELLER ADDRESS) !!!
                // =====================================================================
                const SELLER_ADDRESS = '0xbdDD85bc42010110B8184d0fDA25659688bf935E'; // <-- GANTI INI
                // =====================================================================
                const AMOUNT_TO_PAY = '0.01'; // Jumlah USD1T yang harus dibayar
                const TOKENS_TO_MINT = 5000; // Jumlah token hadiah

                const PLACEHOLDER_ADDRESS = '0xAlamatWalletPenerimaAnda';
                if (SELLER_ADDRESS === PLACEHOLDER_ADDRESS) {
                    addMessage('Error: Frontend not configured (Seller Address).', 'bot', true);
                    mintButton.disabled = false;
                    mintButton.textContent = "Mint 5000 Tokens (1 USD1T)";
                    return;
                }
                
                // Konfigurasi B402 (BSC Testnet)
                const b402 = new B402();
                const requirements = {
                    scheme: 'exact',
                    network: 'bsc-testnet',
                    asset: '0x337610d27c682E347C9cD60BD4b3b107C9d34dDd', // USD1T
                    payTo: SELLER_ADDRESS,
                    amountRequired: ethers.parseUnits(AMOUNT_TO_PAY, 18), 
                    maxTimeoutSeconds: 600,
                    relayerContract: '0xd67eF16fa445101Ef1e1c6A9FB9F3014f1d60DE6'
                };

                try {
                    // 1. Minta Otorisasi dari Pengguna via MetaMask
                    addMessage("Please approve the transaction in MetaMask...", 'bot', true);
                    const { authorization, signature } = await b402.authorize(requirements);
                    
                    addMessage("Authorization received. Sending to server...", 'bot', true);
                    mintButton.textContent = "Processing...";

                    // 2. Kirim Otorisasi ke Backend Anda
                    const response = await fetch('https://api.spark-ai.xyz/accept-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            authorization: authorization,
                            signature: signature,
                            tokensToMint: TOKENS_TO_MINT 
                        })
                    });

                    const data = await response.json();

                    if (!response.ok || !data.success) {
                        throw new Error(data.error || 'Payment settlement failed on server.');
                    }

                    // 3. Sukses!
                    addMessage(`Mint Success! Payment Tx: ${data.paymentTransaction.substring(0,12)}... Reward Tx: ${data.rewardTransaction.substring(0,12)}...`, 'bot');
                    mintButton.textContent = "Minted Successfully!";
                    mintButton.style.backgroundColor = "#28a745"; // Jadi hijau
                    // Biarkan tombol nonaktif setelah sukses

                } catch (error) {
                    console.error('Minting process failed:', error);
                    addMessage(`Minting failed: ${error.message}`, 'bot', true);
                    mintButton.disabled = false; // Aktifkan lagi jika gagal
                    mintButton.textContent = "Mint 5000 Tokens (1 USD1T)";
                }
            });

        });
    </script>
</body>
</html>
